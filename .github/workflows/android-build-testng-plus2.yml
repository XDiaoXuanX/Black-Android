name: Black Android CI

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        if: github.event_name == 'push'
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then
            echo "::error::The XBE_KEY secret is missing"
            exit 1
          fi
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in ci/default.xbe.enc -out assets/default.xbe \
            -pass "file:$key"
          rm -f "$key"

      - name: Build APK
        if: github.event_name == 'push'
        shell: cmd
        run: call build.bat

      - name: Create and push git tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/*.apk
